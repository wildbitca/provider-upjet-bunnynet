name: Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
      message:
        description: 'Tag message'
        required: false
        default: ''

jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Default GITHUB_TOKEN (github-actions[bot]) is blocked by the org
          # tag-protection ruleset; GH_TOKEN is a privileged PAT that bypasses it.
          token: ${{ secrets.GH_TOKEN }}

      - name: Create and push tag
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "::error::GH_TOKEN secret not set; default GITHUB_TOKEN is blocked by the tag ruleset"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MSG="${{ github.event.inputs.message }}"
          git tag -a "${{ github.event.inputs.version }}" -m "${MSG:-${{ github.event.inputs.version }}}"
          git push origin "${{ github.event.inputs.version }}"
