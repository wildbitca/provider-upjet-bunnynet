    bunnynet_pullzone_ratelimit_rule:
        subCategory: ""
        description: This resource manages a rate limit rule for a bunny.net pullzone.
        name: bunnynet_pullzone_ratelimit_rule
        title: bunnynet_pullzone_ratelimit_rule Resource - terraform-provider-bunnynet
        examples:
            - name: wplogin
              manifest: |-
                {
                  "condition": [
                    {
                      "operator": "BEGINSWITH",
                      "value": "/wp-login.php",
                      "variable": "REQUEST_URI"
                    }
                  ],
                  "description": "WordPress Login",
                  "limit": [
                    {
                      "interval": 10,
                      "requests": 2
                    }
                  ],
                  "name": "WordPress Login",
                  "pullzone": "${bunnynet_pullzone.test.id}",
                  "response": [
                    {
                      "interval": 3600
                    }
                  ],
                  "transformations": [
                    "LOWERCASE",
                    "NORMALIZEPATH",
                    "URLDECODE"
                  ]
                }
              references:
                pullzone: bunnynet_pullzone.test.id
        argumentDocs:
            condition: (Block List) The condition to trigger the rate limit rule. (see below for nested schema)
            description: (String) The rate limit rule description.
            id: (Number) The ID of the rate limit rule.
            interval: (Number) The interval, in seconds, to consider for to trigger the rate limit rule.
            limit: (Block, Optional) (see below for nested schema)
            name: (String) The rate limit rule name.
            operator: '(String) Options: BEGINSWITH, CONTAINS, CONTAINSWORD, DETECTSQLI, DETECTXSS, ENDSWITH, EQ, GE, GT, LE, LT, RX, STREQ, STRMATCH, WITHIN'
            pullzone: (Number) The ID of the linked pullzone.
            requests: (Number) The number of request within the interval to trigger the rate limit rule.
            response: (Block, Optional) The response once the rate limit rule is triggered. (see below for nested schema)
            transformations: '(Set of String) Options: CMDLINE, COMPRESSWHITESPACE, CSSDECODE, HEXENCODE, HTMLENTITYDECODE, JSDECODE, LENGTH, LOWERCASE, MD5, NORMALISEPATH, NORMALISEPATHWIN, NORMALIZEPATH, NORMALIZEPATHWIN, REMOVECOMMENTS, REMOVENULLS, REMOVEWHITESPACE, REPLACECOMMENTS, SHA1, URLDECODE, URLDECODEUNI, UTF8TOUNICODE'
            value: (String)
            variable: '(String) Options: ARGS, ARGS_COMBINED_SIZE, ARGS_GET, ARGS_GET_NAMES, ARGS_POST, ARGS_POST_NAMES, FILES_NAMES, FINGERPRINT, GEO, QUERY_STRING, REMOTE_ADDR, REQUEST_BASENAME, REQUEST_BODY, REQUEST_COOKIES, REQUEST_COOKIES_NAMES, REQUEST_FILENAME, REQUEST_HEADERS, REQUEST_HEADERS_NAMES, REQUEST_LINE, REQUEST_METHOD, REQUEST_PROTOCOL, REQUEST_URI, REQUEST_URI_RAW, RESPONSE_BODY, RESPONSE_HEADERS, RESPONSE_STATUS, VERIFIED_BOT_CATEGORY'
            variable_value: (String)
