name: BunnyWay/bunnynet
resources:
    bunnynet_account_subuser:
        subCategory: ""
        description: This resource manages an account sub-user in bunny.net.
        name: bunnynet_account_subuser
        title: bunnynet_account_subuser Resource - terraform-provider-bunnynet
        examples:
            - name: test
              manifest: |-
                {
                  "email": "john@example.com",
                  "firstname": "John",
                  "lastname": "Doe",
                  "password": "${random_password.subuser.result}",
                  "permissions": [
                    "zones",
                    "billing"
                  ]
                }
              references:
                password: random_password.subuser.result
              dependencies:
                random_password.subuser: |-
                    {
                      "length": 17,
                      "lower": true,
                      "numeric": true,
                      "special": true,
                      "upper": true
                    }
        argumentDocs:
            email: (String) The user's email address.
            firstname: (String) The user's first name.
            id: (String) The user's identifier.
            lastname: (String) The user's last name.
            password: '(String, Sensitive, Write-only) The user''s password. This is a write-only field: to update it after creation, re-create the resource.'
            permissions: '(Set of String) Options: abuse, billing, support, users, zones'
        importStatements:
            - terraform import bunnynet_account_subuser.test john@example.com
    bunnynet_compute_container_app:
        subCategory: ""
        description: This resource manages a Magic Containers application in bunny.net.
        name: bunnynet_compute_container_app
        title: bunnynet_compute_container_app Resource - terraform-provider-bunnynet
        examples:
            - name: app
              manifest: |-
                {
                  "autoscaling_max": 3,
                  "autoscaling_min": 1,
                  "container": [
                    {
                      "endpoint": [
                        {
                          "cdn": [
                            {
                              "origin_ssl": false,
                              "sticky_sessions": [
                                {
                                  "headers": [
                                    "X-Forwarded-For"
                                  ]
                                }
                              ]
                            }
                          ],
                          "name": "app",
                          "port": [
                            {
                              "container": 8080,
                              "protocols": [
                                "TCP",
                                "UDP"
                              ]
                            }
                          ],
                          "type": "CDN"
                        }
                      ],
                      "env": [
                        {
                          "name": "APP_ENV",
                          "value": "prod"
                        },
                        {
                          "name": "LISTEN_PORT",
                          "value": "3000"
                        }
                      ],
                      "image_name": "my-app",
                      "image_namespace": "my-org",
                      "image_registry": "${bunnynet_compute_container_imageregistry.github.id}",
                      "image_tag": "2.12.6",
                      "name": "app",
                      "volumemount": [
                        {
                          "name": "data",
                          "path": "/data"
                        }
                      ]
                    },
                    {
                      "image_name": "my-sidecar",
                      "image_namespace": "my-org",
                      "image_registry": "${bunnynet_compute_container_imageregistry.github.id}",
                      "image_tag": "1.3.7",
                      "name": "sidecar"
                    }
                  ],
                  "name": "my-app",
                  "regions_allowed": [
                    "DE",
                    "SG",
                    "NY"
                  ],
                  "regions_required": [
                    "DE"
                  ],
                  "version": 2,
                  "volume": [
                    {
                      "name": "data",
                      "size": 2
                    }
                  ]
                }
              references:
                container.image_registry: bunnynet_compute_container_imageregistry.github.id
        argumentDocs:
            arguments: (String) The arguments that will be added to the container entry point when starting the image.
            autoscaling_max: (Number) The maximum number of instances that will be provisioned per active region.
            autoscaling_min: (Number) The minimum number of instances that will be provisioned per active region.
            cdn: (Block List) Configurations for CDN endpoint. (see below for nested schema)
            command: (String) A custom startup command that will execute once the container is launched.
            container: (Block List) Defines a container for the application. (see below for nested schema)
            endpoint: (Block List) Defines a public endpoint for the application. (see below for nested schema)
            env: (Block List) Defines an environment variable for the container (see below for nested schema)
            expected_status: (Number) The expected HTTP response status code.
            exposed: (Number) The exposed port number.
            failure_threshold: (Number) The number of failed probes to consider the container unhealthy.
            grpc: (Block List) gRPC-specific configurations. (see below for nested schema)
            headers: (Set of String) Incoming request headers used to select a pod for sticky sessions.
            http: (Block List) HTTP-specific configurations. (see below for nested schema)
            id: (String) The unique identifier for the application.
            image_digest: (String) The image digest.
            image_name: '(String) The image name within the registry, without the domain prefix (i.e.: my-app).'
            image_namespace: '(String) The image namespace within the registry, without the domain prefix (i.e.: my-org).'
            image_pull_policy: '(String) Options: Always, IfNotPresent'
            image_registry: (Number) The image registry for the container.
            image_tag: '(String) The image tag (i.e.: 2.9-alpine).'
            initial_delay: (Number) The amount of time in seconds after the container is started to wait before the first probe is sent.
            liveness_probe: (Block List) Checks that the application is actively running without issues. It the check fails, the container will be automatically restarted (see below for nested schema)
            name: (String) The name of the application.
            origin_ssl: (Boolean) Indicates whether the container will handle TLS termination.
            path: (String) The HTTP path to be requested.
            period: (Number) The amount of time in seconds between each probe.
            port: (Block List) Endpoint port configuration. (see below for nested schema)
            protocols: '(Set of String) Options: SCTP, TCP, UDP'
            pullzone_id: (Number) The ID of the pullzone associated with the endpoint.
            readiness_probe: (Block List) Checks if the application is fully prepared to handle incoming requests. No requests will be routed to the application until this check is successful. (see below for nested schema)
            regions_allowed: (Set of String) The regions that will be dynamically provisionable based on the user latency.
            regions_max_allowed: (Number) The maximum amount of regions to be deployed at any given time.
            regions_required: (Set of String) The regions that will be statically provisioned and will always be running and available to users.
            service: (String) The gRPC service name.
            size: (Number) The size of the volume, in Gigabytes (10^9 bytes).
            startup_probe: (Block List) Checks if the application has successfully started. No requests will be routed to the application until this check is successful. (see below for nested schema)
            sticky_sessions: (Block List) Indicates whether sticky sessions is enabled. (see below for nested schema)
            success_threshold: (Number) The number of successful probes to consider the container healthy.
            timeout: (Number) The amount of time in seconds the probe will wait for a response before considering it a failure.
            type: '(String) Options: Anycast, CDN, InternalIP'
            value: (String) The value of the environment variable.
            version: (Number)
            volume: (Block List) Defines a persistent volume to be used by the application. (see below for nested schema)
            volumemount: (Block List) Mounts a volume within a container (see below for nested schema)
            working_dir: (String) The working directory of the container runtime.
        importStatements: []
    bunnynet_compute_container_imageregistry:
        subCategory: ""
        description: This resource manages an Image Registry connection for Magic Containers in bunny.net.
        name: bunnynet_compute_container_imageregistry
        title: bunnynet_compute_container_imageregistry Resource - terraform-provider-bunnynet
        examples:
            - name: github
              manifest: |-
                {
                  "registry": "GitHub",
                  "token": "ghp_abc1234d",
                  "username": "my-github-username"
                }
        argumentDocs:
            id: (Number) The unique identifier for the image registry.
            registry: '(String) Options: DockerHub, GitHub'
            token: (String, Sensitive) The token used to authenticate to the registry. If you are importing a resource, declare the token as an empty string.
            username: (String) The username used to authenticate to the registry.
        importStatements: []
    bunnynet_compute_script:
        subCategory: ""
        description: This resource manages a compute script in bunny.net.
        name: bunnynet_compute_script
        title: bunnynet_compute_script Resource - terraform-provider-bunnynet
        examples:
            - name: test
              manifest: |-
                {
                  "content": "import * as BunnySDK from \"https://esm.sh/@bunny.net/edgescript-sdk@0.10.0\";\n\nBunnySDK.net.http.serve(async (request: Request): Response | Promise\u003cResponse\u003e =\u003e {\n    return new Response('\u003ch1\u003eHello world!\u003c/h1\u003e', {headers: {\"Content-Type\": \"text/html\"}});\n});\n",
                  "name": "test",
                  "type": "standalone"
                }
        argumentDocs:
            content: (String) The code of the script.
            deployment_key: (String) The deployment key for the script.
            id: (Number) The ID of the script.
            name: (String) The name of the script.
            release: (String) The current release identifier for the script.
            type: '(String) Options: middleware, standalone'
        importStatements:
            - terraform import bunnynet_compute_script.test 123
    bunnynet_compute_script_secret:
        subCategory: ""
        description: This resource manages a secret for a Compute Script in bunny.net.
        name: bunnynet_compute_script_secret
        title: bunnynet_compute_script_secret Resource - terraform-provider-bunnynet
        examples:
            - name: APP_SECRET
              manifest: |-
                {
                  "name": "APP_ENV",
                  "script": "${bunnynet_compute_script.test.id}",
                  "value": ""
                }
              references:
                script: bunnynet_compute_script.test.id
        argumentDocs:
            id: (Number) The ID of the secret.
            name: (String) The name of the secret.
            script: (Number) The ID of the associated compute script.
            value: (String, Sensitive) The value of the secret.
        importStatements:
            - terraform import bunnynet_compute_script_secret.test "1234|APP_SECRET"
    bunnynet_compute_script_variable:
        subCategory: ""
        description: This resource manages an Environment variable for a Compute Script in bunny.net.
        name: bunnynet_compute_script_variable
        title: bunnynet_compute_script_variable Resource - terraform-provider-bunnynet
        examples:
            - name: APP_ENV
              manifest: |-
                {
                  "default_value": "prod",
                  "name": "APP_ENV",
                  "required": true,
                  "script": "${bunnynet_compute_script.test.id}"
                }
              references:
                script: bunnynet_compute_script.test.id
        argumentDocs:
            default_value: (String) The default value of the environment variable.
            id: (Number) The ID of the environment variable.
            name: (String) The name of the environment variable.
            required: (Boolean) Indicates whether the environment variable is required.
            script: (Number) The ID of the associated compute script.
        importStatements:
            - terraform import bunnynet_compute_script_variable.test "1234|APP_ENV"
    bunnynet_database:
        subCategory: ""
        description: This resource manages an Database in bunny.net.
        name: bunnynet_database
        title: bunnynet_database Resource - terraform-provider-bunnynet
        examples:
            - name: test
              manifest: |-
                {
                  "name": "mydb",
                  "regions_primary": [
                    "DE",
                    "NY",
                    "SG"
                  ],
                  "regions_replica": [
                    "LA",
                    "UK",
                    "SYD"
                  ]
                }
        argumentDocs:
            id: (String) The unique identifier for the database.
            name: (String) The name of the database.
            regions_primary: (Set of String)
            regions_replica: (Set of String)
            url: (String) The connection URL for the database.
        importStatements:
            - terraform import bunnynet_database.test db_01KF0XCACH2JDPGHZT3284MZ2V
    bunnynet_dns_record:
        subCategory: ""
        description: This resource manages DNS records in a bunny.net DNS zone. It is used to create, update, and delete DNS records within a specific DNS zone managed by bunny.net.
        name: bunnynet_dns_record
        title: bunnynet_dns_record Resource - terraform-provider-bunnynet
        examples:
            - name: MX
              manifest: |-
                {
                  "name": "",
                  "type": "A",
                  "value": "192.0.2.33",
                  "zone": "${bunnynet_dns_zone.example.id}"
                }
              references:
                zone: bunnynet_dns_zone.example.id
        argumentDocs:
            accelerated: (Boolean) Indicates whether the DNS record should utilize bunny.net’s acceleration services.
            accelerated_pullzone: (Number) The ID of the accelerated pull zone.
            comment: (String) This property allows users to add descriptive notes for documentation and management purposes.
            enabled: (Boolean) Indicates whether the DNS record is enabled.
            flags: (Number) Flags for advanced DNS settings.
            geolocation_lat: (Number) The latitude for geolocation-based routing.
            geolocation_long: (Number) The longitude for geolocation-based routing.
            id: (Number) The unique identifier for the DNS record.
            latency_zone: (String) The latency zone for latency-based routing.
            link_name: (String) The name of the linked resource.
            monitor_type: '(String) Options: Http, Monitor, None, Ping'
            name: (String) The name of the DNS record. Use name = "" for apex domain records.
            port: (Number) The port number for services that require a specific port.
            priority: (Number) The priority of the DNS record.
            pullzone_id: (Number) The ID of the linked pullzone.
            smart_routing_type: '(String) Options: Geolocation, Latency, None'
            tag: (String) A tag for the DNS record.
            ttl: (Number) The time-to-live value for the DNS record.
            type: '(String) Options: A, AAAA, CAA, CNAME, Flatten, HTTPS, MX, NS, PTR, PullZone, Redirect, SRV, SVCB, Script, TLSA, TXT'
            value: (String) The value of the DNS record.
            weight: (Number) The weight of the DNS record. It is used in load balancing scenarios to distribute traffic based on the specified weight.
            zone: (Number) ID of the related DNS zone.
        importStatements:
            - terraform import bunnynet_dns_record.test "$ZONE_ID|$RECORD_ID"
    bunnynet_dns_script Resource - terraform-provider-bunnynet:
        subCategory: ""
        description: This resource manages a DNS script in bunny.net.
        name: bunnynet_dns_script Resource - terraform-provider-bunnynet
        title: bunnynet_dns_script Resource - terraform-provider-bunnynet
        argumentDocs:
            content: (String) The code of the script.
            id: (Number) The ID of the script.
            name: (String) The name of the script.
            release: (String) The current release identifier for the script.
        importStatements: []
    bunnynet_dns_script_variable Resource - terraform-provider-bunnynet:
        subCategory: ""
        description: This resource manages an Environment Variable for a DNS Script in bunny.net.
        name: bunnynet_dns_script_variable Resource - terraform-provider-bunnynet
        title: bunnynet_dns_script_variable Resource - terraform-provider-bunnynet
        argumentDocs:
            id: (Number) The ID of the environment variable.
            name: (String) The name of the environment variable.
            script: (Number) The ID of the associated DNS script.
            value: (String) The value of the environment variable.
        importStatements: []
    bunnynet_dns_zone:
        subCategory: ""
        description: This resource manages a DNS zone in bunny.net. It is used to create and manage DNS zones.
        name: bunnynet_dns_zone
        title: bunnynet_dns_zone Resource - terraform-provider-bunnynet
        examples:
            - name: example
              manifest: |-
                {
                  "domain": "example.com"
                }
        argumentDocs:
            dnssec_algorithm: (Number) The DNSSEC algorithm.
            dnssec_digest: (String) The DNSSEC digest.
            dnssec_digest_type: (Number) The DNSSEC digest type.
            dnssec_enabled: (Boolean) Indicates whether DNSSEC is enabled.
            dnssec_flags: (Number) The DNSSEC flags.
            dnssec_keytag: (Number) The DNSSEC key tag.
            dnssec_public_key: (String) The DNSSEC public key.
            domain: (String) The domain name for the DNS zone.
            id: (Number) The unique identifier for the DNS zone.
            log_anonymized: (Boolean) Indicates whether DNS logs are anonymized.
            log_anonymized_style: '(String) Options: Drop, OneDigit'
            log_enabled: (Boolean) Indicates whether permanent logging for DNS queries is enabled.
            nameserver_custom: (Boolean) Indicates whether custom nameservers are used.
            nameserver1: (String) The primary nameserver for the DNS zone.
            nameserver2: (String) The secondary nameserver for the DNS zone.
            soa_email: (String) The email address used in the Start of Authority (SOA) record for the DNS zone.
        importStatements:
            - terraform import bunnynet_dns_zone.test 123
    bunnynet_pullzone:
        subCategory: ""
        description: This resource manages a bunny.net Pullzone. Pullzones fetch content from the origin server and deliver it to end-users.
        name: bunnynet_pullzone
        title: bunnynet_pullzone Resource - terraform-provider-bunnynet
        examples:
            - name: example
              manifest: |-
                {
                  "name": "my-website",
                  "origin": [
                    {
                      "type": "OriginUrl",
                      "url": "https://192.0.2.1"
                    }
                  ],
                  "routing": [
                    {
                      "tier": "Standard"
                    }
                  ]
                }
        argumentDocs:
            add_canonical_header: (Boolean) Indicates whether the Canonical header is added to the responses.
            allow_referers: '(Set of String) The list of referrer hostnames that are allowed to access the pull zone. Requests containing the header "Referer: hostname" that is not on the list will be rejected. If empty, all the referrers are allowed.'
            block_ips: (Set of String) The list of IPs that are blocked from accessing the pull zone. Requests coming from the following IPs will be rejected. If empty, all the IPs will be allowed
            block_no_referer: (Boolean) Indicates whether requests without a referer should be blocked.
            block_post_requests: (Boolean) Indicates whether to block POST requests.
            block_referers: '(Set of String) The list of referrer hostnames that are blocked to access the pull zone. Requests containing the header "Referer: hostname" that is not on the list will be rejected. If empty, all the referrers are allowed.'
            block_root_path: (Boolean) This property indicates whether to block the root path.
            blocked_countries: (Set of String) The list of blocked countries with the two-letter Alpha2 ISO codes. Traffic connecting from a blocked country will be rejected on the DNS level.
            cache_chunked: (Boolean) Indicates whether the cache slice (Optimize for large object delivery) feature is enabled for the Pull Zone
            cache_enabled: (Boolean) Indicates whether smart caching is enabled.
            cache_errors: (Boolean) Indicates whether bunny.net should be caching error responses.
            cache_expiration_time: (Number) The override cache time, in seconds.
            cache_expiration_time_browser: (Number) The override cache time for the end client, in seconds.
            cache_stale: '(Set of String) Options: offline, updating'
            cache_vary: '(Set of String) Options: avif, cookie, country, hostname, mobile, querystring, state, webp'
            cache_vary_cookie: (Set of String) Contains the list of vary parameters that will be used for vary cache by cookie string. If empty, cookie vary will not be used.
            cache_vary_headers: (Set of String) Contains the list of request headers will be used for vary cache. If empty, it will not be used.
            cache_vary_querystring: (Set of String) Contains the list of vary parameters that will be used for vary cache by query string. If empty, all parameters will be used to construct the key
            cdn_domain: (String) The CNAME domain of the pull zone for setting up custom hostnames
            container_app_id: (String) The ID if the compute container app.
            container_endpoint_id: (String) The ID if the compute container app endpoint.
            cors_enabled: (Boolean) Indicates whether CORS (Cross-Origin Resource Sharing) is enabled.
            cors_extensions: (Set of String) A list of file extensions for which CORS is enabled.
            disable_letsencrypt: (Boolean) If true, the built-in let's encrypt is disabled and requests are passed to the origin.
            dns_port: (Number) The port for DNS Accelerated endpoints.
            dns_scheme: (String) The scheme for DNS Accelerated endpoints.
            errorpage_custom_content: (String) Contains the custom error page code that will be returned.
            errorpage_custom_enabled: (Boolean) Indicates whether custom error page code should be enabled.
            errorpage_statuspage_code: (String) The statuspage code that will be used to build the status widget.
            errorpage_statuspage_enabled: (Boolean) Indicates whether the statuspage widget should be displayed on the error pages.
            errorpage_whitelabel: (Boolean) Indicates whether the error pages should be white-labelled or not
            filters: '(Set of String) Options: all, eu, scripting'
            follow_redirects: (Boolean) Indicates whether the zone will follow origin redirects.
            forward_host_header: (Boolean) Indicates whether the current hostname is forwarded to the origin.
            host_header: (String) The host header that will be sent to the origin.
            id: (Number) The unique ID of the pull zone.
            limit_after: (Number) The amount of data after the rate limit will be activated.
            limit_bandwidth: (Number) The maximum bandwidth limit in bytes.
            limit_burst: (Number) Excessive requests are delayed until their number exceeds the maximum burst size.
            limit_connections: (Number) The number of connections limited per IP.
            limit_download_speed: (Number) The maximum download speed, in kb/s. Use 0 for unlimited.
            limit_requests: (Number) The maximum amount of requests per IP per second.
            log_anonymized: (Boolean) Indicates whether logs are anonymized.
            log_anonymized_style: '(String) Options: Drop, OneDigit'
            log_enabled: (Boolean) Indicates whether logging is enabled.
            log_forward_enabled: (Boolean) Indicates whether log forwarding is enabled.
            log_forward_format: '(String) Options: JSON, Plain'
            log_forward_port: (Number) The port number for log forwarding.
            log_forward_protocol: '(String) Options: DataDog, TCP, TCPEncrypted, UDP'
            log_forward_server: (String) The server address for log forwarding.
            log_forward_token: (String) The token used for log forwarding authentication.
            log_storage_enabled: (Boolean) Indicates whether log storage is enabled.
            log_storage_zone: (Number) The storage zone ID for log storage.
            middleware_script: (Number) The ID of the compute script used as a middleware.
            name: (String) The name of the pull zone.
            optimizer_burrow: (Boolean) Indicates whether Burrow Smart Routing should be enabled.
            optimizer_classes_force: (Boolean) Indicates whether the optimizer class list should be enforced.
            optimizer_dynamic_image_api: (Boolean) Indicates whether the image manipulation should be enabled.
            optimizer_enabled: (Boolean) Indicates whether Bunny Optimizer should be enabled.
            optimizer_html_prerender: (Boolean) Indicates whether HTML Prerender should be enabled.
            optimizer_minify_css: (Boolean) Indicates whether the CSS minification should be enabled.
            optimizer_minify_js: (Boolean) Indicates whether the JavaScript minification should be enabled.
            optimizer_smartimage: (Boolean) Indicates whether the automatic image optimization should be enabled.
            optimizer_smartimage_desktop_maxwidth: (Number) The maximum automatic image size for desktop clients.
            optimizer_smartimage_desktop_quality: (Number) The image quality for desktop clients.
            optimizer_smartimage_mobile_maxwidth: (Number) The maximum automatic image size for mobile clients.
            optimizer_smartimage_mobile_quality: (Number) Determines the image quality for mobile clients
            optimizer_watermark: (Boolean) Indicates whether image watermarking should be enabled.
            optimizer_watermark_borderoffset: (Number) The offset of the watermark image.
            optimizer_watermark_minsize: (Number) The minimum image size to which the watermark will be added.
            optimizer_watermark_position: '(String) Options: BottomLeft, BottomRight, Center, CenterStretch, TopLeft, TopRight'
            optimizer_watermark_url: (String) The URL of the watermark image.
            optimizer_webp: (Boolean) Indicates whether the WebP optimization should be enabled.
            origin: (Block, Optional) (see below for nested schema)
            originshield_concurrency_limit: (Boolean) Indicates whether there is a concurrency limit for Origin Shield.
            originshield_concurrency_requests: (Number) The number of concurrent requests for Origin Shield.
            originshield_enabled: (Boolean) Indicates whether Origin Shield is enabled.
            originshield_queue_requests: (Number) The number of queued requests for Origin Shield.
            originshield_queue_wait: (Number) The maximum wait time for queued requests in Origin Shield, in seconds.
            originshield_zone: '(String) Options: FR, IL'
            permacache_storagezone: (Number) The storage zone ID for Perma-Cache.
            redirected_countries: (Set of String) The list of budget redirected countries with the two-letter Alpha2 ISO codes. Traffic from a redirected country will connect to the cheapest possible node in North America or Europe.
            request_coalescing_enabled: (Boolean) Indicates whether request coalescing is enabled.
            request_coalescing_timeout: (Number) Specifies the timeout period, in seconds, for request coalescing, determining how long to wait before sending combined requests to the origin.
            routing: (Block, Optional) (see below for nested schema)
            s3_auth_enabled: (Boolean) Indicates whether requests to origin will be signed with AWS Signature Version 4.
            s3_auth_key: (String) The access key used to authenticate the requests.
            s3_auth_region: (String) The region name of the bucket used to authenticate the requests.
            s3_auth_secret: (String) The secret key used to authenticate the requests.
            safehop_connection_timeout: (Number) The amount of seconds to wait when connecting to the origin. Otherwise the request will fail or retry.
            safehop_enabled: (Boolean)
            safehop_response_timeout: (Number) The amount of seconds to wait when waiting for the origin reply. Otherwise the request will fail or retry.
            safehop_retry_count: (Number) The number of retries to the origin server.
            safehop_retry_delay: (Number) The amount of time that the CDN should wait before retrying an origin request.
            safehop_retry_reasons: '(Set of String) Options: 5xxResponse, connectionTimeout, responseTimeout'
            script: (Number) The ID of the linked compute script.
            script_execute_before_cache: (Boolean) Indicates whether the script will execute ahead of the cache layer.
            sort_querystring: (Boolean) If enabled, the query parameters will be automatically sorted into a consistent order before checking the cache.
            storagezone: (Number) The ID of the linked storage zone.
            strip_cookies: (Boolean) If enabled, bunny.net will strip all the Set-Cookie headers from the HTTP responses.
            tier: '(String) Options: Standard, Volume'
            tls_support: '(Set of String) Options: TLSv1.0, TLSv1.1'
